plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.astro.autoreject'
    compileSdk 36

    defaultConfig {
        applicationId 'com.astro.autoreject'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Debug-signed so CI can produce an installable APK with no secrets.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
